<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <!-- Your visible content goes here -->
         <main id="app">
            <h1 class="title">Welcome</h1>
                <ul class="menu">
                    <li class="item active">Home</li>
                    <li class="item">About</li>
                    <li class="item">Contact</li>
                </ul>
            <button data-action="save" disabled>Save</button>
            <div id="status-card" class="card pending">
                <h2 id="status-title">Processing Payment...</h2>
                <p class="details">Please wait while we verify your card.</p>
                <button id="cancel-btn" class="btn primary">Cancel</button>
            </div>
            <section id="dashboard">
                <h2>User Stats</h2>
                <div class="card">
                    <p class="metric">Score: 100</p>
                    <button class="edit-btn">Edit</button>
                </div>
                <div class="card">
                    <p class="metric">Score: 85</p>
                </div>
            </section>
            <ul id="todo-list">
                <li class="task done">Buy milk</li>
  
                <li class="task active">
                    <span>Write code</span>
                    <button class="delete-btn">X</button>
                </li>
  
                <li class="task done">Walk dog</li>
            </ul>
        </main>

        <script src="dom.js"></script>
    </body>
</html>
