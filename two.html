<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <div id="quick-add-container">
            <input type="text" id="item-input" placeholder="Add a new item ...">
            <button id="add-btn" type="button">Add Item</button>
            <ul id="item-list"></ul>
        </div>
        <div id="outer">
            <div id="middle">
                <button id="inner-btn">Click Me</button>
            </div>
        </div>
        <div id="toolbar">
            <button class="tool-btn" data-action="bold"><span>Bold</span></button>
            <button class="tool-btn" data-action="italic">Italic</button>
            <button class="tool-btn" data-action="underline">Underline</button>
            <span class="divider"></span>
            <button class="tool-btn" data-action="save">Save</button>
        </div>
    </main>
    <script src="form.js"></script>
</body>
</html>
